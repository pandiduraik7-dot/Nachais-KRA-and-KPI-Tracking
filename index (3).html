<style>
:root{--brand:#d92d2d;--brand-d:#b32020;--ink:#1c1c1e;--mut:#71717a;--line:#e4e4e7;--bg:#fafafa}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:24px;margin:0}h2{font-size:16px;margin:0 0 12px}h3{font-size:15px;margin:0}
.wrap{max-width:1150px;margin:0 auto;padding:20px 16px}
.bar{position:sticky;top:0;z-index:10;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar .in{max-width:1150px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}.brand img{width:34px;height:34px}
.nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}.nav a{padding:6px 12px;border-radius:8px;color:#52525b;font-weight:500}
.nav a:hover,.nav a.on{background:#f4f4f5;color:var(--ink);text-decoration:none}.nav a.on{font-weight:700}
.me{text-align:right;line-height:1.2}.me b{display:block}.me small{color:var(--mut);font-size:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 2px #0000000d;margin-bottom:16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.hide-s{display:none}}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat p{margin:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.stat .v{font-size:28px;font-weight:700;margin-top:4px}.stat .s{font-size:12px;color:var(--mut);margin-top:2px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #d4d4d8;border-radius:8px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #d92d2d33;border-color:var(--brand)}
input:disabled,select:disabled,textarea:disabled{background:#f4f4f5}
label{display:block;font-size:12px;font-weight:600;color:#52525b;margin:10px 0 4px}
button,.btn{font:inherit;font-weight:600;border-radius:8px;padding:8px 16px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;display:inline-block}
button:hover{background:var(--brand-d)}button:disabled{opacity:.5;cursor:default}
button.ghost{background:#fff;color:#3f3f46;border-color:#d4d4d8}button.ghost:hover{background:#f4f4f5}
button.danger{background:#fff;color:#b91c1c;border-color:#fecaca}button.danger:hover{background:#fef2f2}
button.sm{padding:5px 10px;font-size:13px}
.msg{padding:9px 12px;border-radius:8px;margin:12px 0;font-size:13px}.err{background:#fef2f2;color:#b91c1c}.ok{background:#ecfdf5;color:#047857}.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}.info{background:#f0f9ff;color:#075985;border:1px solid #bae6fd}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mut);padding:6px 8px 6px 0}td{padding:9px 8px 9px 0;border-top:1px solid #f4f4f5;vertical-align:middle}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.sb{display:flex;align-items:center;gap:8px;min-width:150px}.sb .t{flex:1;height:10px;background:#f4f4f5;border-radius:99px;overflow:hidden}.sb .f{height:100%;border-radius:99px}.sb span{white-space:nowrap;width:46px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.trend{display:flex;gap:10px;align-items:flex-end}.trend>div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.trend .col{height:110px;background:#f4f4f5;border-radius:6px;display:flex;align-items:flex-end;margin:4px 0}.trend .col i{display:block;width:100%;border-radius:6px}.trend b{color:var(--ink);font-size:12px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}.top p{margin:4px 0 0;color:var(--mut)}
.mn{display:flex;align-items:center;gap:6px}.mn a,.mn span.d{border:1px solid #d4d4d8;background:#fff;border-radius:8px;padding:5px 11px;color:#3f3f46}.mn span.d{opacity:.4}.mn b{min-width:92px;text-align:center}
.kra{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--brand);letter-spacing:.04em}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.mut{color:var(--mut)}.sm2{font-size:12px}.tag{background:#f4f4f5;color:#52525b;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
details>summary{cursor:pointer}details[open]>summary{margin-bottom:8px}
.auth{max-width:420px;margin:7vh auto;padding:0 16px}.auth .logo{text-align:center;margin-bottom:16px}.auth img{width:72px}
.chip{border:1px solid #d4d4d8;background:#fff;border-radius:99px;padding:4px 12px;color:#3f3f46;display:inline-block}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.guide img{max-width:100%;max-height:260px;object-fit:contain;display:block;background:#fafafa;border-bottom:1px solid var(--line)}
.empty{border:1px dashed #d4d4d8;border-radius:12px;padding:30px;text-align:center;color:var(--mut)}
.ur{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.1fr 1.2fr .8fr auto;gap:8px;align-items:center;border-top:1px solid #f4f4f5;padding:10px 0}
@media(max-width:900px){.ur{grid-template-columns:1fr 1fr}}
.sub{margin:0 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--mut)}
.load{padding:60px;text-align:center;color:var(--mut)}
</style>
</head>

/* ---------- helpers ---------- */
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { me: null };
const HOME = { employee: "#/employee", manager: "#/manager", management: "#/management" };
const ROLE_LABEL = { employee: "Employee", manager: "Manager", management: "Management" };
const num = v => (v === null || v === undefined || v === "" ? null : Number(v));

/* ---------- periods ---------- */
const pad = n => String(n).padStart(2, "0");
const curP = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const shiftP = (p, k) => { const [y, m] = p.split("-").map(Number); return curP(new Date(y, m - 1 + k, 1)); };
const lastP = (n, from) => Array.from({ length: n }, (_, i) => shiftP(from, i - (n - 1)));
const pLabel = p => { const [y, m] = p.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleString("en-IN", { month: "short", year: "numeric" }); };
const validP = p => /^\d{4}-(0[1-9]|1[0-2])$/.test(p || "");
const dueDate = p => { const [y, m] = p.split("-").map(Number); return new Date(y, m, CONFIG.DUE_DAY, 23, 59, 59); };
const isOnTime = (p, at) => !!at && new Date(at) <= dueDate(p);
const kpiDue = (f, p) => f === "Monthly" || [3, 6, 9, 12].includes(Number(p.split("-")[1]));
const fmtDate = (d, o = { day: "numeric", month: "short" }) => new Date(d).toLocaleDateString("en-IN", o);

/* ---------- scoring ---------- */
function kpiScore(k, v) {
  if (v === null || v === undefined) return null;
  const t = Number(k.target);
  if (k.direction === "higher") return t <= 0 ? 100 : Math.max(0, Math.min(100, (v / t) * 100));
  if (v <= t || t >= 100) return 100;
  return Math.max(0, Math.min(100, (1 - (v - t) / (100 - t)) * 100));
}
const avg = a => { const v = a.filter(x => typeof x === "number" && !isNaN(x)); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };
const pct = (n, d = 0) => (n === null || n === undefined ? "–" : n.toFixed(d) + "%");
function band(s) {
  if (s === null || s === undefined) return { l: "No data", bg: "#f4f4f5", fg: "#52525b", bar: "#d4d4d8" };
  if (s >= 90) return { l: "Excellent", bg: "#d1fae5", fg: "#065f46", bar: "#10b981" };
  if (s >= 75) return { l: "Good", bg: "#e0f2fe", fg: "#075985", bar: "#0ea5e9" };
  if (s >= 60) return { l: "Needs focus", bg: "#fef3c7", fg: "#92400e", bar: "#f59e0b" };
  return { l: "At risk", bg: "#fee2e2", fg: "#991b1b", bar: "#ef4444" };
}

/* ---------- small UI pieces ---------- */
const sbar = (s, label = true) => `<div class="sb"><div class="t"><div class="f" style="width:${Math.max(0, Math.min(100, s ?? 0))}%;background:${band(s).bar}"></div></div>${label ? `<span>${pct(s)}</span>` : ""}</div>`;
const badge = s => { const b = band(s); return `<span class="pill" style="background:${b.bg};color:${b.fg}">${b.l}</span>`; };
const STATUS = { none: ["Not started", "#f4f4f5", "#52525b"], draft: ["Draft", "#f4f4f5", "#3f3f46"], submitted: ["Sent to manager", "#e0f2fe", "#075985"], returned: ["Returned", "#fef3c7", "#92400e"], approved: ["Approved", "#d1fae5", "#065f46"] };
const pill = s => { const [l, bg, fg] = STATUS[s] || STATUS.none; return `<span class="pill" style="background:${bg};color:${fg}">${l}</span>`; };
const stat = (l, v, s = "") => `<div class="stat"><p>${l}</p><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
const title = (t, sub = "", right = "") => `<div class="top"><div><h1>${t}</h1>${sub ? `<p>${sub}</p>` : ""}</div>${right}</div>`;
const empty = t => `<div class="empty">${t}</div>`;
function monthNav(base, p, extra = "") {
  const next = shiftP(p, 1), max = curP();
  return `<div class="mn"><a href="${base}?period=${shiftP(p, -1)}${extra}">‹</a><b>${pLabel(p)}</b>${p < max ? `<a href="${base}?period=${next}${extra}">›</a>` : `<span class="d">›</span>`}</div>`;
}
function trendBars(rows) {
  return `<div class="trend">${rows.map(r => `<div><b>${r.score === null ? "–" : r.score.toFixed(0) + "%"}</b><div class="col"><i style="height:${r.score === null ? 0 : Math.max(r.score, 3)}%;background:${band(r.score).bar}"></i></div>${pLabel(r.period)}</div>`).join("")}</div>`;
}

/* ---------- data layer ---------- */
async function fetchAll(make) {                       // Supabase returns max 1000 rows per call → page through
  let out = [], from = 0;
  for (;;) {
    const { data, error } = await make().range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) return out;
    from += 1000;
  }
}
async function loadKras({ department, role, includeArchived } = {}) {
  let q = sb.from("kras").select("*, kpis(*)").order("sort_order").order("created_at");
  if (department) q = q.eq("department", department);
  if (role) q = q.eq("role", role);
  if (!includeArchived) q = q.eq("active", true);
  const { data, error } = await q;
  if (error) throw error;
  return (data || []).map(k => ({ ...k, kpis: (k.kpis || []).filter(p => includeArchived || p.active).sort((a, b) => a.sort_order - b.sort_order) }));
}
function buildReport(p, kras, entries, subs, periods) {
  const kpis = new Map(), kraOf = new Map();
  kras.forEach(k => k.kpis.forEach(x => { kpis.set(x.id, x); kraOf.set(x.id, k.title); }));
  const mine = entries.filter(e => e.employee_id === p.id), mySubs = subs.filter(s => s.employee_id === p.id);
  const now = curP(), joined = p.created_at ? curP(new Date(p.created_at)) : periods[0];
  const rows = periods.map(period => {
    const es = mine.filter(e => e.period === period && kpis.has(e.kpi_id));
    const sub = mySubs.find(s => s.period === period);
    const due = [...kpis.values()].filter(k => kpiDue(k.frequency, period)).length;
    const sent = sub && (sub.status === "submitted" || sub.status === "approved");
    return { period, score: avg(es.map(e => kpiScore(kpis.get(e.kpi_id), num(e.value)))), filled: es.length, due, status: sub ? sub.status : "none", submittedAt: sub ? sub.submitted_at : null, onTime: !!sent && isOnTime(period, sub.submitted_at) };
  });
  const scored = rows.filter(r => r.score !== null);
  const expected = rows.filter(r => r.period >= joined && (r.period < now || r.status === "submitted" || r.status === "approved"));
  const submitted = expected.filter(r => r.status === "submitted" || r.status === "approved");
  const kpiAv = [...kpis.values()].map(kpi => {
    const es = mine.filter(e => e.kpi_id === kpi.id && periods.includes(e.period) && e.value !== null);
    return { kpi, kra: kraOf.get(kpi.id), avg: avg(es.map(e => Number(e.value))), score: avg(es.map(e => kpiScore(kpi, Number(e.value)))), count: es.length };
  });
  const last = scored.length ? scored[scored.length - 1].score : null, prev = scored.length > 1 ? scored[scored.length - 2].score : null;
  return { p, rows, avgScore: avg(scored.map(r => r.score)), latest: last, trend: last !== null && prev !== null ? last - prev : null,
    subRate: expected.length ? submitted.length / expected.length * 100 : null, onTimeRate: submitted.length ? submitted.filter(r => r.onTime).length / submitted.length * 100 : null,
    sentN: submitted.length, expN: expected.length, kpiAv };
}
async function loadReports(people, periods) {
  if (!people.length) return [];
  const ids = people.map(p => p.id);
  const [entries, subs, kras] = await Promise.all([
    fetchAll(() => sb.from("entries").select("*").in("employee_id", ids).in("period", periods).order("id")),
    fetchAll(() => sb.from("submissions").select("*").in("employee_id", ids).in("period", periods).order("id")),
    loadKras({ includeArchived: true })]);
  return people.map(p => buildReport(p, kras.filter(k => k.department === p.department && k.role === p.job_title), entries, subs, periods));
}
function teamSummary(reps, period) {
  const rows = reps.map(r => r.rows.find(x => x.period === period));
  return { size: reps.length, periodScore: avg(rows.map(x => (x ? x.score : null))), avgScore: avg(reps.map(r => r.avgScore)),
    sent: rows.filter(x => x && (x.status === "submitted" || x.status === "approved")).length, subRate: avg(reps.map(r => r.subRate)), onTime: avg(reps.map(r => r.onTimeRate)) };
}

/* ---------- router ---------- */
function parseHash() {
  const h = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = h.split("?");
  return { path: path || "/", q: Object.fromEntries(new URLSearchParams(qs || "")) };
}
const go = h => { if (location.hash === h) route(); else location.hash = h; };
const PUBLIC = ["/login", "/signup", "/forgot", "/reset"];
let routing = 0;
async function route() {
  const my = ++routing;
  try {
    const { path, q } = parseHash();
    const { data: { session } } = await sb.auth.getSession();
    if (my !== routing) return;
    if (!session) {
      S.me = null;
      if (!PUBLIC.includes(path)) return go("#/login");
      return ($app.innerHTML = PAGES[path](q));
    }
    if (path === "/reset") return ($app.innerHTML = PAGES["/reset"](q));
    if (!S.me || S.me.id !== session.user.id) {
      const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
      S.me = data;
    }
    const m = S.me;
    if (!m || !m.active) { await sb.auth.signOut(); S.me = null; $app.innerHTML = authPage("Account not active", "", `<p>This account is not active. Please contact management.</p><p><a href="#/login">Back to log in</a></p>`); return; }
    if (m.role === "employee" && !m.onboarded && path !== "/onboarding") return go("#/onboarding");
    if (path === "/onboarding") { if (m.role !== "employee" || m.onboarded) return go(HOME[m.role]); return ($app.innerHTML = await PAGES["/onboarding"](q)); }
    if (path === "/" || PUBLIC.includes(path)) return go(HOME[m.role]);
    if (path === "/account") return ($app.innerHTML = shell(PAGES["/account"](), path));
    const seg = path.split("/")[1];
    if (seg !== m.role) return go(HOME[m.role]);
    const fn = ROUTES.find(r => r[0].test(path));
    if (!fn) return go(HOME[m.role]);
    $app.innerHTML = shell(`<div class="load">Loading…</div>`, path);
    const html = await fn[1](path.match(fn[0]), q);
    if (my !== routing) return;
    $app.innerHTML = shell(html, path);
    window.scrollTo(0, 0);
    afterRender();
  } catch (e) {
    console.error(e);
    $app.innerHTML = `<div class="wrap"><div class="msg err">Something went wrong: ${esc(e.message || e)}</div><p><a href="#/">Back to home</a></p></div>`;
  }
}

async function managementPerson(mt, q) {

  let h = title(esc(person.full_name || person.email), `${ROLE_LABEL[person.role]} · ${esc(person.department || "")} · ${esc(person.email)}`, monthNav(base, period));

function kraSetup(kras, dept, roles) {
  const grouped = new Map(); kras.forEach(k => grouped.set(k.role, [...(grouped.get(k.role) || []), k]));
  let h = `<details class="card"><summary style="font-weight:700;color:var(--brand)">+ Add a KRA to ${esc(dept)}</summary><form data-act="savekra"><input type="hidden" name="department" value="${esc(dept)}">
    <label>Role this KRA applies to (employees with this role will see it)</label><input name="role" required list="rolelist" placeholder="e.g. HR Lead"><datalist id="rolelist">${roles.map(r => `<option value="${esc(r)}">`).join("")}</datalist>
    <label>KRA — the expected result</label><input name="title" required placeholder="e.g. Required manpower is available within the planned timeline"><div class="fmsg"></div><button class="ghost" style="margin-top:12px">Add KRA</button></form></details>`;
  if (!kras.length) h += empty(`No KRAs in ${esc(dept)} yet. Add the first one above.`);
  for (const [role, list] of grouped) {
    h += `<p class="sub" style="margin-top:20px">${esc(role)}</p>`;
    for (const kra of list) {
      h += `<div class="card" style="${kra.active ? "" : "opacity:.6"}"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="kra">KRA ${kra.active ? "" : "(archived)"}</div><h3>${esc(kra.title)}</h3></div>
        <button class="${kra.active ? "danger" : "ghost"} sm" data-click="kraactive" data-id="${kra.id}" data-active="${!kra.active}">${kra.active ? "Remove KRA" : "Restore KRA"}</button></div>
        <details style="margin-top:8px"><summary class="mut">Edit KRA text / role</summary><form data-act="savekra"><input type="hidden" name="id" value="${kra.id}"><input type="hidden" name="department" value="${esc(kra.department)}"><label>Role</label><input name="role" required value="${esc(kra.role)}"><label>KRA</label><input name="title" required value="${esc(kra.title)}"><div class="fmsg"></div><button class="ghost sm" style="margin-top:10px">Save KRA</button></form></details>
        <div style="margin-top:14px;border:1px solid var(--line);border-radius:10px">${kra.kpis.map(k => `<details style="padding:10px 12px;border-top:1px solid #f4f4f5;${k.active ? "" : "opacity:.6"}"><summary><b>${esc(k.name)}</b>${k.active ? "" : " (archived)"} <span class="mut sm2">· ${k.frequency} · ${k.direction === "lower" ? "≤" : "≥"}${k.target}% · ${esc(k.how_to_measure)}</span></summary>
          ${kpiForm(kra.id, k)}<div style="margin-top:10px"><button class="${k.active ? "danger" : "ghost"} sm" data-click="kpiactive" data-id="${k.id}" data-active="${!k.active}">${k.active ? "Remove KPI" : "Restore KPI"}</button> <span class="mut sm2">Removed KPIs are archived, not deleted — past reports keep their history.</span></div></details>`).join("") || '<p class="mut" style="padding:10px 12px;margin:0">No KPIs yet.</p>'}</div>
        <details style="margin-top:12px"><summary style="font-weight:600;color:var(--brand)">+ Add KPI under this KRA</summary>${kpiForm(kra.id)}</details></div>`;
    }
  }
  return h;
}

/* ============================================================
   ACTIONS (form submits & button clicks)
   ============================================================ */
const str = (fd, k) => String(fd.get(k) ?? "").trim();
const ACT = {
  async login(f, fd) {
    const { error } = await sb.auth.signInWithPassword({ email: str(fd, "email"), password: String(fd.get("password")) });
    if (error) return setMsg(f, "err", error.message);
    S.me = null; go("#/");
  },
  async signup(f, fd) {
    const pw = String(fd.get("password"));
    if (pw.length < 8) return setMsg(f, "err", "Password must be at least 8 characters.");
    if (pw !== String(fd.get("confirm"))) return setMsg(f, "err", "Passwords do not match.");
    const { data, error } = await sb.auth.signUp({ email: str(fd, "email"), password: pw, options: { data: { full_name: str(fd, "full_name") }, emailRedirectTo: location.origin + location.pathname } });
    if (error) return setMsg(f, "err", error.message);
    if (!data.session) return setMsg(f, "ok", "Account created. Check your email for a confirmation link, then log in.");
    S.me = null; go("#/onboarding");
  },
  async forgot(f, fd) {
    const { error } = await sb.auth.resetPasswordForEmail(str(fd, "email"), { redirectTo: location.origin + location.pathname });
    setMsg(f, error ? "err" : "ok", error ? error.message : "If that email exists, a reset link is on its way.");
  },
  async reset(f, fd) {
    const pw = String(fd.get("password"));
    if (pw.length < 8) return setMsg(f, "err", "Password must be at least 8 characters.");
    if (pw !== String(fd.get("confirm"))) return setMsg(f, "err", "Passwords do not match.");
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) return setMsg(f, "err", error.message);
    S.me = null; go("#/");
  },
  async account(f, fd) {
    const name = str(fd, "full_name"); if (!name) return setMsg(f, "err", "Name cannot be empty.");
    const { error } = await sb.from("profiles").update({ full_name: name }).eq("id", S.me.id);
    if (error) return setMsg(f, "err", error.message);
    S.me.full_name = name; setMsg(f, "ok", "Profile updated.");
  },
  async changepw(f, fd) {
    const pw = String(fd.get("password"));
    if (pw.length < 8) return setMsg(f, "err", "New password must be at least 8 characters.");
    if (pw !== String(fd.get("confirm"))) return setMsg(f, "err", "New passwords do not match.");
    const chk = await sb.auth.signInWithPassword({ email: S.me.email, password: String(fd.get("current")) });
    if (chk.error) return setMsg(f, "err", "Current password is incorrect.");
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) return setMsg(f, "err", error.message);
    f.reset(); setMsg(f, "ok", "Password changed.");
  },
  async onboard(f, fd) {
    const row = { department: str(fd, "department"), job_title: str(fd, "job_title"), manager_id: str(fd, "manager_id") || null, onboarded: true };
    if (!row.department || !row.job_title) return setMsg(f, "err", "Please choose your department and role.");
    if (!row.manager_id) return setMsg(f, "err", "Please choose your manager.");
    const { error } = await sb.from("profiles").update(row).eq("id", S.me.id);
    if (error) return setMsg(f, "err", error.message);
    S.me = null; go("#/employee");
  },
  async savereport(f, fd, sub) {
    const period = f.dataset.period, intent = (sub && sub.value) || "draft", uid = S.me.id;
    const { data: cur } = await sb.from("submissions").select("status").eq("employee_id", uid).eq("period", period).maybeSingle();
    if (cur && (cur.status === "submitted" || cur.status === "approved")) return setMsg(f, "err", "This month has already been sent to your manager and is locked.");
    const kpis = (await employeeKras()).flatMap(k => k.kpis), due = kpis.filter(k => kpiDue(k.frequency, period));
    const ups = [], dels = [], filled = new Set();
    for (const k of kpis) {
      const n = str(fd, "n_" + k.id), d = str(fd, "d_" + k.id);
      if (n === "" && d === "") { dels.push(k.id); continue; }
      if (n === "" || d === "") return setMsg(f, "err", `"${k.name}": please fill both numbers.`);
      const nn = Number(n), dd = Number(d);
      if (!isFinite(nn) || !isFinite(dd) || nn < 0 || dd < 0) return setMsg(f, "err", `"${k.name}": numbers must be 0 or more.`);
      filled.add(k.id); ups.push({ employee_id: uid, kpi_id: k.id, period, numerator: nn, denominator: dd, remarks: str(fd, "r_" + k.id) || null });
    }
    if (intent === "submit") {
      const missing = due.filter(k => !filled.has(k.id));
      if (missing.length) return setMsg(f, "err", "Please fill every KPI before sending. Missing: " + missing.map(x => x.name).join(", "));
      if (!due.length) return setMsg(f, "err", "You have no KPIs to report this month.");
      if (!confirm("Send this month's report to your manager? You won't be able to edit it unless it is returned.")) return;
    }
    if (dels.length) { const { error } = await sb.from("entries").delete().eq("employee_id", uid).eq("period", period).in("kpi_id", dels); if (error) return setMsg(f, "err", error.message); }
    if (ups.length) { const { error } = await sb.from("entries").upsert(ups, { onConflict: "employee_id,kpi_id,period" }); if (error) return setMsg(f, "err", error.message); }
    const { error } = await sb.from("submissions").upsert({ employee_id: uid, period, status: intent === "submit" ? "submitted" : "draft", employee_note: str(fd, "employee_note") || null }, { onConflict: "employee_id,period" });
    if (error) return setMsg(f, "err", error.message);
    if (intent === "submit") { alert("Sent to your manager. Thank you!"); return route(); }
    setMsg(f, "ok", "Draft saved.");
  },
  async review(f, fd, sub) {
    const decision = sub && sub.value, comment = str(fd, "comment") || null;
    if (decision === "returned" && !comment) return setMsg(f, "err", "Please add a comment so the employee knows what to fix.");
    const { data, error } = await sb.from("submissions").update({ status: decision, manager_comment: comment }).eq("id", f.dataset.id).eq("status", "submitted").select("id");
    if (error) return setMsg(f, "err", error.message);
    if (!data || !data.length) return setMsg(f, "err", "This report is no longer waiting for review.");
    route();
  },
  async savekra(f, fd) {
    const id = str(fd, "id"), row = { department: str(fd, "department"), role: str(fd, "role"), title: str(fd, "title") };
    if (!row.department || !row.role || !row.title) return setMsg(f, "err", "Department, role and KRA are all required.");
    const res = id ? await sb.from("kras").update({ role: row.role, title: row.title }).eq("id", id).select("id")
                   : await sb.from("kras").insert({ ...row, created_by: S.me.id, sort_order: 999 }).select("id");
    if (res.error) return setMsg(f, "err", res.error.message);
    if (!res.data || !res.data.length) return setMsg(f, "err", "You don't have permission to change this KRA.");
    route();
  },
  async savekpi(f, fd) {
    const id = str(fd, "id"), name = str(fd, "name"), nl = str(fd, "numerator_label"), dl = str(fd, "denominator_label"), target = Number(str(fd, "target") || 100);
    if (!name || !nl || !dl) return setMsg(f, "err", "KPI name and both measurement labels are required.");
    if (!(target >= 0 && target <= 100)) return setMsg(f, "err", "Target must be between 0 and 100.");
    const row = { name, numerator_label: nl, denominator_label: dl, how_to_measure: str(fd, "how_to_measure") || `${nl} ÷ ${dl} × 100`, frequency: str(fd, "frequency") === "Quarterly" ? "Quarterly" : "Monthly",
      direction: str(fd, "direction") === "lower" ? "lower" : "higher", target, guide_when: str(fd, "guide_when") || null, guide_steps: str(fd, "guide_steps") || null, guide_image_url: str(fd, "guide_image_url") || null };
    const res = id ? await sb.from("kpis").update(row).eq("id", id).select("id") : await sb.from("kpis").insert({ ...row, kra_id: str(fd, "kra_id"), sort_order: 999 }).select("id");
    if (res.error) return setMsg(f, "err", res.error.message);
    if (!res.data || !res.data.length) return setMsg(f, "err", "You don't have permission to change this KPI.");
    route();
  },
  async adddept(f, fd) {
    const name = str(fd, "name"); if (!name) return;
    const { error } = await sb.from("departments").insert({ name });
    if (error) return alert(error.code === "23505" ? "That department already exists." : error.message);
    go("#/management/kra?dept=" + encodeURIComponent(name));
  },
  async saveuser(f, fd) {
    const id = str(fd, "id"), role = str(fd, "role");
    if (id === S.me.id && role !== "management") return setMsg(f, "err", "You can't remove your own management access.");
    const row = { role, department: str(fd, "department") || null, job_title: str(fd, "job_title") || null, manager_id: str(fd, "manager_id") || null };
    if (id !== S.me.id) row.active = str(fd, "active") === "true";
    if (role !== "employee") row.onboarded = true;
    const { data, error } = await sb.from("profiles").update(row).eq("id", id).select("id");
    if (error) return setMsg(f, "err", error.message);
    if (!data || !data.length) return setMsg(f, "err", "Not allowed.");
    setMsg(f, "ok", "User updated.");
  }
};

document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-act]"); if (!f) return;
  e.preventDefault();
  const sub = e.submitter, btns = [...f.querySelectorAll("button")];
  btns.forEach(b => (b.disabled = true)); setMsg(f, "", "");
  try { await ACT[f.dataset.act](f, new FormData(f), sub); } catch (err) { console.error(err); setMsg(f, "err", err.message || String(err)); }

});
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-click]"); if (!el) return;
  e.preventDefault();
  try { await CLICK[el.dataset.click](el); } catch (err) { alert(err.message || err); }
});
/* live % on the update form */
document.addEventListener("input", e => {
  const box = e.target.closest(".kpi[data-kpi]"); if (!box) return;
  const n = box.querySelector('input[name^="n_"]').value, d = box.querySelector('input[name^="d_"]').value, out = box.querySelector("[data-out]");
  if (n === "" || d === "") { out.textContent = "–"; out.style.color = ""; return; }
  const v = Number(d) > 0 ? Number(n) * 100 / Number(d) : null;
  out.textContent = v === null ? "N/A" : v.toFixed(1) + "%";
  out.style.color = v === null ? "" : band(kpiScore({ direction: box.dataset.dir, target: box.dataset.target }, v)).fg;
});
/* guide-sheet picture upload */
document.addEventListener("change", async e => {
  const inp = e.target.closest("input[data-upload]"); if (!inp || !inp.files[0]) return;
  const file = inp.files[0], form = inp.closest("form"), msg = form.querySelector("[data-uploadmsg]");
  if (!file.type.startsWith("image/")) return (msg.textContent = "Please choose an image file.");
  if (file.size > 5 * 1024 * 1024) return (msg.textContent = "Image must be under 5 MB.");
  msg.textContent = "Uploading…";
  const ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "");
  const path = `${inp.dataset.upload}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from("guides").upload(path, file, { contentType: file.type });
  if (error) return (msg.textContent = error.message);
  const url = sb.storage.from("guides").getPublicUrl(path).data.publicUrl;
  form.querySelector('[name="guide_image_url"]').value = url;
  form.querySelector("[data-prev]").innerHTML = `<img src="${esc(url)}" style="height:70px;border:1px solid var(--line);border-radius:6px">`;
  msg.textContent = "Uploaded — press Save to keep it.";
});
/* onboarding dependent dropdowns */
document.addEventListener("change", e => {
  if (e.target.id !== "ob-dept") return;
  const d = e.target.value, roles = S.onb.roles.filter(r => r.department === d), mg = S.onb.managers.filter(m => m.department === d);
  document.getElementById("ob-role").innerHTML = `<option value="">Select…</option>` + roles.map(r => `<option>${esc(r.role)}</option>`).join("");
  document.getElementById("ob-mgr").innerHTML = `<option value="">Select…</option>` + mg.map(m => `<option value="${m.id}">${esc(m.full_name)}</option>`).join("");
});
function afterRender() {}

/* ---------- start ---------- */
if (CONFIG.SUPABASE_ANON_KEY.startsWith("PASTE")) {
  $app.innerHTML = `<div class="wrap"><div class="msg warn"><b>Setup needed:</b> open <code>index.html</code>, find <code>CONFIG</code> near the top of the script, and paste your Supabase anon key (Supabase → Project Settings → API).</div></div>`;
} else {
  sb.auth.onAuthStateChange((ev) => { if (ev === "PASSWORD_RECOVERY") { go("#/reset"); } else if (ev === "SIGNED_OUT") { S.me = null; } });
  window.addEventListener("hashchange", route);
  route();
}
</script>
